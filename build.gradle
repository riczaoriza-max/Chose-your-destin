allprojects {
    group = 'com.kotoritos.choosedestiny'
    version = '1.1.0'

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
    }
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(17)
    }
}
